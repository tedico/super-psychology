[project]
name = "sp-worker"
version = "0.1.0"
description = "Super Psychology video pipeline (cloned from KontentMaschine worker 2026-07-05)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.9",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "notion-client>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
